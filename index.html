<!DOCTYPE html>
<html lang="en" data-theme="neon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kea Mission Control</title>
<meta name="description" content="A GitHub-backed board for tasks, pull requests and inspiration.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo/k-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/logo/k-512.png">
<link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
<meta property="og:title" content="Kea Mission Control">
<meta property="og:description" content="A GitHub-backed board for tasks, pull requests and inspiration.">
<meta property="og:image" content="assets/logo/kea-wordmark-720.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

  <symbol id="i-pr" viewBox="0 0 24 24"><circle cx="6.5" cy="5.5" r="2.5"/><circle cx="6.5" cy="18.5" r="2.5"/><circle cx="17.5" cy="18.5" r="2.5"/><path d="M6.5 8v8M17.5 16v-5a3 3 0 0 0-3-3h-3.5"/><path d="M13 5.5 11 8l2 2.5"/></symbol>

  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3A5 5 0 0 0 13.4 3.4l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3A5 5 0 0 0 10.6 20.6l1.7-1.7"/></symbol>

<div class="app" id="app">

  <aside class="sidebar">
    <div class="brand">
      <i class="k-mark" id="kMark" aria-hidden="true"></i>
      <div class="brand-text"><b>Kea</b><span>mission control</span></div>
    </div>

    <div class="repo-picker">
      <label class="micro">Repository</label>
      <select id="repoSelect" class="select"></select>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item is-active" data-view="board"><svg><use href="#i-board"/></svg><span>Board</span><i class="nav-count" id="cntBoard"></i></button>
      <button class="nav-item" data-view="prs"><svg><use href="#i-pr"/></svg><span>Pull Requests</span><i class="nav-count" id="cntPrs"></i></button>
      <button class="nav-item" data-view="milestones"><svg><use href="#i-flag"/></svg><span>Milestones</span><i class="nav-count" id="cntMs"></i></button>
      <button class="nav-item" data-view="ideas"><svg><use href="#i-bulb"/></svg><span>Ideas</span><i class="nav-count" id="cntIdeas"></i></button>
      <button class="nav-item" data-view="inspiration"><svg><use href="#i-spark"/></svg><span>Inspiration</span><i class="nav-count" id="cntInsp"></i></button>
      <button class="nav-item" data-view="assets"><svg><use href="#i-grid"/></svg><span>Assets</span><i class="nav-count" id="cntAssets"></i></button>
      <button class="nav-item" data-view="docs"><svg><use href="#i-doc"/></svg><span>Design Docs</span></button>
      <button class="nav-item" data-view="progress"><svg><use href="#i-chart"/></svg><span>Progress</span></button>
      <button class="nav-item" data-view="settings"><svg><use href="#i-cog"/></svg><span>Settings</span></button>
    </nav>

    <div class="sidebar-foot">
      <div class="theme-row">
        <label class="micro">Theme</label>
        <div class="theme-dots" id="themeDots"></div>
      </div>
      <div class="conn" id="conn"></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn btn-ghost menu-btn" id="btnMenu" aria-label="Menu"><svg><use href="#i-menu"/></svg></button>
        <h1 class="view-title" id="viewTitle">Board</h1>
        <span class="repo-chip" id="repoChip"></span>
      </div>
      <div class="topbar-right">
        <div class="search">
          <svg><use href="#i-search"/></svg>
          <input id="search" type="search" placeholder="Search tasks…" autocomplete="off">
        </div>
        <button class="btn btn-ghost" id="btnRefresh" title="Refresh from GitHub"><svg><use href="#i-refresh"/></svg></button>
        <button class="btn btn-primary" id="btnNew"><svg><use href="#i-plus"/></svg><span>New</span></button>
      </div>
    </header>

    <div class="filters" id="filters"></div>

    <div class="views">
      <section class="view" id="view-board"><div class="board" id="board"></div></section>
      <section class="view" id="view-prs" hidden><div class="pr-wrap" id="prWrap"></div></section>
      <section class="view" id="view-ideas" hidden><div id="ideasWrap"></div></section>
      <section class="view" id="view-inspiration" hidden><div id="inspWrap"></div></section>
      <section class="view" id="view-milestones" hidden><div id="msWrap"></div></section>
      <section class="view" id="view-assets" hidden><div id="assetsWrap"></div></section>
      <section class="view" id="view-docs" hidden><div id="docsWrap"></div></section>
      <section class="view" id="view-progress" hidden><div id="progWrap"></div></section>
      <section class="view" id="view-settings" hidden><div id="setWrap"></div></section>
    </div>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="toasts" id="toasts"></div>
<div class="modal-root" id="modalRoot" hidden></div>
<div class="drag-ghost" id="dragGhost" hidden></div>

<script src="assets/js/core.js"></script>
<script src="assets/js/board.js"></script>
<script src="assets/js/views.js"></script>
<script src="assets/js/extras.js"></script>
</body>
</html>
